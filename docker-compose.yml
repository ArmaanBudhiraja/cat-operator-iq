version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cat_postgres
    environment:
      POSTGRES_USER: cat_user
      POSTGRES_PASSWORD: cat_password
      POSTGRES_DB: cat_operator_iq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat_user -d cat_operator_iq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cat_backend
    environment:
      - DATABASE_URL=postgresql://cat_user:cat_password@postgres:5432/cat_operator_iq
      - RANDOM_SEED=42
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: cat_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
